<!doctype html>
<html lang="en" style="background: #050914; color: #e8eefc">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archora</title>
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        background: #050914;
        color: #e8eefc;
      }

      /* Light theme surface overrides — applied when the inline script sets
         data-theme="light" before Vue mounts. */
      :root[data-theme='light'],
      :root[data-theme='light'] body,
      :root[data-theme='light'] #app {
        background: #f5f6f9;
        color: #0f1115;
      }

      .startup-fallback {
        box-sizing: border-box;
        display: grid;
        height: 100%;
        place-items: center;
        padding: 24px;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #050914;
      }

      :root[data-theme='light'] .startup-fallback {
        background: #f5f6f9;
      }

      .startup-fallback__panel {
        width: min(480px, 100%);
        overflow: hidden;
        border: 1px solid rgb(126 159 204 / 0.18);
        border-radius: 12px;
        background: #08111d;
        box-shadow: 0 22px 80px rgb(0 0 0 / 0.34);
      }

      :root[data-theme='light'] .startup-fallback__panel {
        border-color: rgb(0 0 0 / 0.09);
        background: #ffffff;
        box-shadow: 0 4px 24px rgb(0 0 0 / 0.08), 0 1px 3px rgb(0 0 0 / 0.06);
      }

      .startup-fallback__header,
      .startup-fallback__body {
        padding: 20px 24px;
      }

      .startup-fallback__header {
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid rgb(126 159 204 / 0.14);
      }

      :root[data-theme='light'] .startup-fallback__header {
        border-bottom-color: rgb(0 0 0 / 0.07);
      }

      .startup-fallback__brand-mark {
        display: grid;
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        place-items: center;
        border: 1px solid rgb(124 109 255 / 0.5);
        border-radius: 8px;
        color: #fff;
        font-size: 10px;
        font-weight: 850;
        background: linear-gradient(135deg, #7c6dff, #4f7cff);
        box-shadow: 0 8px 24px -10px rgb(124 109 255 / 0.8);
      }

      .startup-fallback__brand-copy {
        display: grid;
        gap: 2px;
      }

      .startup-fallback__eyebrow {
        margin: 0;
        color: #91a2ba;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      :root[data-theme='light'] .startup-fallback__eyebrow {
        color: #6b7283;
      }

      .startup-fallback__title {
        margin: 0;
        color: #eef0f5;
        font-size: 14px;
        font-weight: 650;
        line-height: 1.2;
      }

      :root[data-theme='light'] .startup-fallback__title {
        color: #0f1115;
      }

      .startup-fallback__body {
        display: grid;
        gap: 10px;
      }

      .startup-fallback__stage {
        margin: 0;
        color: #9aa0b0;
        font-size: 12px;
      }

      :root[data-theme='light'] .startup-fallback__stage {
        color: #6b7283;
      }

      .startup-fallback__bar {
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(113 139 177 / 0.18);
      }

      :root[data-theme='light'] .startup-fallback__bar {
        background: rgb(0 0 0 / 0.08);
      }

      .startup-fallback__bar span {
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: #7c6dff;
        animation: archora-startup-pulse 1.4s ease-in-out infinite alternate;
      }

      @keyframes archora-startup-pulse {
        from {
          transform: translateX(-14%);
        }
        to {
          transform: translateX(164%);
        }
      }
    </style>
    <script>
      (function () {
        try {
          performance.mark('archora:app-start');
          performance.mark('archora:index-html-loaded');
          var debugPerf =
            new URLSearchParams(window.location.search).get('debugPerf') === '1' ||
            localStorage.getItem('archora.debugPerf') === '1';
          if (debugPerf) {
            console.info('[startup] index.html loaded', {
              elapsedFromNavigationStartMs: Math.round(performance.now()),
              elapsedFromMainImportMs: null,
              elapsedFromAppMountMs: null,
            });
          }
          var stored = localStorage.getItem('fs:theme');
          var theme = stored;
          if (!theme || theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body class="bg-bg text-text" style="background: #050914; color: #e8eefc">
    <div id="app">
      <section class="startup-fallback" aria-live="polite">
        <div class="startup-fallback__panel">
          <header class="startup-fallback__header">
            <div class="startup-fallback__brand-mark" aria-hidden="true">FS</div>
            <div class="startup-fallback__brand-copy">
              <p class="startup-fallback__eyebrow">Archora</p>
              <h1 class="startup-fallback__title">A map of your frontend architecture</h1>
            </div>
          </header>
          <main class="startup-fallback__body">
            <p class="startup-fallback__stage">Starting…</p>
            <div class="startup-fallback__bar" aria-label="Starting Archora">
              <span></span>
            </div>
          </main>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
