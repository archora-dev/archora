name: Desktop release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libdbus-1-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev

      - run: npm ci

      - name: Build desktop bundle
        run: npm run tauri:build
        env:
          VITE_ARCHORA_LICENSE_PUBLIC_KEY_JWK: ${{ secrets.ARCHORA_LICENSE_PUBLIC_KEY_JWK }}

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: archora-desktop-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: error

      - name: Attach installers to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(find src-tauri/target/release/bundle \
            -maxdepth 2 -type f \
            \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" \
               -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" \))
          if [ -n "$files" ]; then
            gh release upload "${GITHUB_REF_NAME}" $files --clobber
          fi

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: archora-${{ runner.os }}.spdx.json
          format: spdx-json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: archora-sbom-${{ runner.os }}
          path: archora-${{ runner.os }}.spdx.json
          if-no-files-found: error

      - name: Attest desktop artifact
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: src-tauri/target/release/bundle/**

      - name: Attest SBOM
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: archora-${{ runner.os }}.spdx.json

  publish-npm:
    name: Publish npm packages
    # Runs after the desktop build of every platform succeeds, on tag pushes only.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm run test

      # @archora/core ships TypeScript source (no build step); @archora/cli builds
      # its dist via the package `prepack` script during publish.
      - name: Publish @archora/core
        run: npm publish -w @archora/core --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @archora/cli
        run: npm publish -w @archora/cli --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
