[package]
name = "archora"
version = "2.0.0"
description = "Archora - architectural reconnaissance for large frontend codebases"
authors = ["Archora <archora@archora.dev>"]
license = "BUSL-1.1"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "archora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
ignore = "0.4"
walkdir = "2"
tokio = { version = "1", features = ["fs", "rt", "macros"] }
notify = "6"
notify-debouncer-full = "0.3"

[dev-dependencies]
tempfile = "3.27.0"
